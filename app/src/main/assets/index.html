<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aether PUA RPG Pro</title>
    <style>
        :root { --bg: #050505; --msg-user: #1f2937; --msg-ai: #0f0f13; --accent: #ef4444; --text: #e5e7eb; --coach: #3b82f6; --tip: #fbbf24; --good: #10b981; --bad: #ef4444;}
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        #setup-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,5,5,0.98); z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; text-align: center; }
        #setup-modal h1 { color: var(--accent); font-size: 28px; margin-bottom: 5px; letter-spacing: 2px; font-weight: 900; }
        .setup-group { width: 100%; max-width: 350px; margin-bottom: 15px; text-align: left; }
        .setup-group label { display: block; font-size: 12px; font-weight: bold; color: #d1d5db; margin-bottom: 5px; text-transform: uppercase;}
        .setup-group select { width: 100%; background: #111; color: #fff; border: 1px solid #333; padding: 12px; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box; }
        .start-btn { background: var(--accent); color: #fff; border: none; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; max-width: 350px; margin-top: 10px; }

        #hud { background: #111; padding: 10px 15px; border-bottom: 1px solid #333; display: flex; flex-direction: column; gap: 5px; }
        .hud-row { display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; color: #9ca3af; text-transform: uppercase; }
        .bar-bg { width: 100%; height: 8px; background: #333; border-radius: 4px; overflow: hidden; }
        #interest-bar { height: 100%; width: 50%; background: var(--good); transition: width 0.3s, background 0.3s; }

        #tip-popup { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: #1f2937; border-left: 5px solid var(--tip); color: #fff; padding: 12px 18px; border-radius: 8px; z-index: 900; width: 90%; max-width: 380px; transition: top 0.4s ease-in-out; font-size: 13px; box-shadow: 0 4px 15px rgba(0,0,0,0.8); }
        #tip-popup.show { top: 20px; }
        #tip-popup strong { color: var(--tip); display: block; margin-bottom: 5px; font-size: 11px; text-transform: uppercase; }

        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 95%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
        .user { align-self: flex-end; background-color: var(--msg-user); border-bottom-right-radius: 2px; border: 1px solid #374151; }
        .ai { align-self: flex-start; background-color: var(--msg-ai); border-bottom-left-radius: 2px; border: 1px solid #333; width: 100%; }
        
        .coach-box { background: #0f172a; border-left: 4px solid var(--coach); padding: 10px; margin-top: 10px; border-radius: 4px; font-size: 13px; color: #93c5fd; }
        .persona-box { background: #2a1b1b; border-left: 4px solid var(--accent); padding: 10px; margin-bottom: 10px; border-radius: 4px; color: #fca5a5; font-style: italic;}
        .score { font-weight: bold; font-size: 16px; display: block; margin-bottom: 5px; }
        
        #input-area { padding: 10px; background: #111; border-top: 1px solid #333; display: flex; gap: 8px; align-items: flex-end; }
        textarea { flex: 1; background-color: #1f2937; border: 1px solid #374151; border-radius: 20px; padding: 12px 15px; color: white; resize: none; font-size: 14px; outline: none; max-height: 80px; }
        button.send { background: var(--accent); color: white; border: none; border-radius: 50%; width: 45px; height: 45px; font-size: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center;}
        
        #options-area { display: flex; overflow-x: auto; gap: 8px; padding: 10px 15px; background: #111; border-top: 1px solid #333; scrollbar-width: none;}
        .option-chip { background: #1f2937; color: #d1d5db; border: 1px solid #374151; padding: 8px 12px; border-radius: 15px; font-size: 12px; white-space: nowrap; cursor: pointer; }
        .option-chip:active { background: var(--accent); color: #fff; }
    </style>
</head>
<body>

    <div id="setup-modal">
        <h1>AETHER ELITE</h1>
        <p style="color:#9ca3af; font-size:13px; margin-bottom: 20px;">Simulador de Texto Livre</p>
        
        <div class="setup-group">
            <label>Alvo</label>
            <select id="target-select">
                <option value="fria">Fria / Arrogante</option>
                <option value="extrovertida">Extrovertida</option>
                <option value="nerd">Nerd / Introvertida</option>
            </select>
        </div>

        <div class="setup-group">
            <label>Mentor</label>
            <select id="mentor-select">
                <option value="mentalist">O Mentalista (Leitura Fria / NLP)</option>
                <option value="mystery">Mystery (Negs / DHV)</option>
                <option value="strauss">Neil Strauss (Storytelling)</option>
                <option value="julien">Julien Blanc (Dominância)</option>
            </select>
        </div>

        <button class="start-btn" onclick="iniciarJogo()">INICIAR TREINO</button>
    </div>

    <div id="hud">
        <div class="hud-row">
            <span id="fase-text">FASE 1: ABERTURA</span>
            <span id="interest-text">INTERESSE: 50%</span>
        </div>
        <div class="bar-bg"><div id="interest-bar"></div></div>
    </div>

    <div id="tip-popup"><strong>💡 Dica do Mentor</strong><span id="tip-text"></span></div>

    <div id="chat"></div>

    <div id="options-area">
        <div class="option-chip" onclick="inserirTexto('Você parece ser do tipo que esconde um lado selvagem.')">Leitura Fria</div>
        <div class="option-chip" onclick="inserirTexto('Eu sinto que a maioria das pessoas te entende errado.')">Efeito Barnum</div>
        <div class="option-chip" onclick="inserirTexto('Sinta a vibe do lugar, e imagine o que eu vou falar agora.')">Comando Embutido</div>
    </div>

    <div id="input-area">
        <textarea id="prompt" rows="1" placeholder="Digite sua abordagem..." onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); enviarTexto();}"></textarea>
        <button class="send" onclick="enviarTexto()">↑</button>
    </div>

    <script>
        let activeMentor = "mentalist";
        let activeTarget = "fria";
        let currentInterest = 50;
        let currentFase = 1; 

        const chat = document.getElementById('chat');
        const interestBar = document.getElementById('interest-bar');
        const interestText = document.getElementById('interest-text');
        const faseText = document.getElementById('fase-text');
        const promptInput = document.getElementById('prompt');

        function iniciarJogo() {
            activeMentor = document.getElementById('mentor-select').value;
            activeTarget = document.getElementById('target-select').value;
            document.getElementById('setup-modal').style.display = 'none';
            
            currentInterest = 50;
            currentFase = 1;
            atualizarHUD();
            
            let intro = "";
            if(activeTarget === 'fria') intro = "Ela está encostada na parede com os braços cruzados. Te olhando de cima a baixo.";
            if(activeTarget === 'extrovertida') intro = "Ela está rindo alto e dançando com as amigas. A energia dela é enorme.";
            if(activeTarget === 'nerd') intro = "Ela está num canto, lendo algo no celular com fones de ouvido.";

            addMsg(`<div class="persona-box"><strong>Situação:</strong><br>${intro}</div>`, 'ai', true);
            
            let mentorIntro = "";
            if(activeMentor === 'mentalist') mentorIntro = "Use Leitura Fria ('Você parece...', 'Eu sinto...'), Efeito Barnum (vago mas específico) e Comandos Embutidos ('Imagine', 'Sinta').";
            else mentorIntro = "Use as técnicas do seu mentor para abrir o jogo.";

            addMsg(`<div class="coach-box"><strong>${activeMentor.toUpperCase()}:</strong><br>Sua missão é abrir o jogo. ${mentorIntro}</div>`, 'ai', true);
            atualizarChips();
        }

        function atualizarChips() {
            let area = document.getElementById('options-area');
            area.innerHTML = '';
            let chips = [];
            
            if (activeMentor === 'mentalist') {
                chips = [
                    {t: "Você parece ser do tipo que esconde um lado selvagem.", l: "Leitura Fria"},
                    {t: "Eu sinto que a maioria das pessoas te entende errado.", l: "Barnum"},
                    {t: "Sinta a vibe do lugar, e imagine o que eu vou falar agora.", l: "Comando Embutido"}
                ];
            } else if (activeMentor === 'mystery') {
                chips = [
                    {t: "Vocês parecem irmãs, mas brigaram no carro, né?", l: "Indireto"},
                    {t: "Seu cabelo tá meio bagunçado hoje.", l: "Neg"},
                    {t: "Eu tava ali com meus amigos, a gente tava falando de...", l: "DHV"}
                ];
            } else if (activeMentor === 'julien') {
                chips = [
                    {t: "Chega quebrando o rapport: 'Seu cabelo tá bagunçado'.", l: "Dominância"},
                    {t: "Vem comigo, vai ser divertido.", l: "Liderança"},
                    {t: "Sorria e mantenha o contato visual.", l: "Escalação"}
                ];
            } else {
                chips = [
                    {t: "Sabe qual é a coisa mais estranha que me aconteceu?", l: "Storytelling"},
                    {t: "Eu tenho um segredo que nunca contei pra ninguém.", l: "Vulnerabilidade"}
                ];
            }

            chips.forEach(c => {
                let d = document.createElement('div');
                d.className = 'option-chip';
                d.innerText = c.l;
                d.onclick = () => inserirTexto(c.t);
                area.appendChild(d);
            });
        }

        function atualizarHUD() {
            interestBar.style.width = currentInterest + '%';
            interestText.innerText = `INTERESSE: ${currentInterest}%`;
            
            if (currentInterest >= 70) interestBar.style.background = 'var(--good)';
            else if (currentInterest >= 40) interestBar.style.background = 'var(--tip)';
            else interestBar.style.background = 'var(--bad)';

            if (currentFase === 1) faseText.innerText = "FASE 1: ABERTURA";
            if (currentFase === 2) faseText.innerText = "FASE 2: CONEXÃO";
            if (currentFase === 3) faseText.innerText = "FASE 3: FECHAMENTO";
        }

        function inserirTexto(texto) {
            promptInput.value = texto;
            promptInput.focus();
        }

        function analisarTexto(texto) {
            texto = texto.toLowerCase();
            let dano = 0;
            let feedback = "";
            let reacao = "";

            // --- LÓGICA DO MENTALISTA ---
            if (activeMentor === 'mentalist') {
                if (texto.includes("parece") || texto.includes("sinto") || texto.includes("tipo")) {
                    dano += 25; 
                    feedback = "Leitura Fria (Cold Reading). Você fez uma afirmação vaga parecer uma percepção profunda.";
                    reacao = "Ela arregala os olhos: 'Nossa, como você soube disso?'";
                }
                else if (texto.includes("maioria") || texto.includes("esconde") || texto.includes("entende")) {
                    dano += 20;
                    feedback = "Efeito Barnum. A afirmação serve para qualquer pessoa, mas ela achou que era única.";
                    reacao = "Ela sorri de lado: 'Ninguém nunca me descreveu tão bem'.";
                }
                else if (texto.includes("imagine") || texto.includes("sinta") || texto.includes("vibe")) {
                    dano += 15;
                    feedback = "Comando Embutido (NLP). Você plantou uma ideia no subconsciente dela.";
                    reacao = "Ela relaxa os ombros e se aproxima um pouco.";
                }
                else if (texto.includes("beijo") || texto.includes("sair")) {
                    dano -= 30; 
                    feedback = "Erro fatal. O mentalista nunca quebra o frame pedindo algo diretamente.";
                    reacao = "Ela volta à postura defensiva: 'Calma, estranho'.";
                }
                else {
                    dano -= 10;
                    feedback = "Muito lógico. O mentalista fala com o subconsciente, não com a razão.";
                    reacao = "Ela dá de ombros e olha para o celular.";
                }
            } 
            // --- LÓGICA DOS OUTROS MENTORES ---
            else {
                if (texto.includes("linda") || texto.includes("gata")) {
                    dano -= 20; feedback = "Elogio genérico. Abaixou seu valor.";
                    reacao = "Ela revira os olhos: 'Já ouvi isso hoje'.";
                } 
                else if (texto.includes("cabelo") || texto.includes("sapato") || texto.includes("estilo")) {
                    dano += 15; feedback = "Bom detalhe situacional.";
                    reacao = "Ela toca no próprio cabelo: 'Você acha?'.";
                }
                else if (texto.includes("viagem") || texto.includes("trabalho")) {
                    dano += 20; feedback = "DHV. Mostrou valor.";
                    reacao = "Ela se inclina, interessada.";
                }
                else if (texto.includes("beijo") || texto.includes("sair") || texto.includes("motel")) {
                    dano -= 30; feedback = "Muito rápido. Quebrou o rapport.";
                    reacao = "Ela se afasta e cruza os braços.";
                }
                else {
                    dano -= 5; feedback = "Neutro. Não gerou atração.";
                    reacao = "Ela dá um sorriso amarelo.";
                }
            }

            // Modificadores do Alvo
            if (activeTarget === 'fria' && dano > 0) dano = Math.floor(dano / 2);
            if (activeTarget === 'extrovertida' && texto.includes("festa") || texto.includes("dançar")) dano += 10; 
            if (activeTarget === 'nerd' && activeMentor === 'mentalist' && texto.includes("parece")) dano += 10; // Nerd ama ser "lida"

            return { dano, feedback, reacao };
        }

        function enviarTexto() {
            const texto = promptInput.value.trim();
            if (!texto) return;

            addMsg(texto, 'user');
            promptInput.value = '';
            promptInput.style.height = 'auto';

            let resultado = analisarTexto(texto);
            currentInterest += resultado.dano;
            if (currentInterest > 100) currentInterest = 100;
            if (currentInterest < 0) currentInterest = 0;
            
            atualizarHUD();

            let scoreClass = resultado.dano >= 0 ? "var(--good)" : "var(--bad)";
            let scoreText = (resultado.dano >= 0 ? "+" : "") + resultado.dano + "%";

            let html = `
                <div class="persona-box"><strong>Reação:</strong><br>${resultado.reacao}</div>
                <div class="coach-box">
                    <strong>Análise do Coach:</strong><br>
                    <span class="score" style="color:${scoreClass}">${scoreText} de Interesse</span>
                    ${resultado.feedback}
                </div>
            `;
            addMsg(html, 'ai', true);

            if (currentInterest <= 0) {
                gameOver(false);
                return;
            }

            if (currentInterest >= 85) {
                if (currentFase === 1) {
                    currentFase = 2;
                    currentInterest = 50;
                    atualizarHUD();
                    addMsg("<div class='coach-box'><strong>AVANÇO DE FASE!</strong><br>Abertura concluída. Agora crie conexão emocional.</div>", 'ai', true);
                    mostrarDica("Use o Efeito Barnum para parecer que a entende.");
                } else if (currentFase === 2) {
                    currentFase = 3;
                    currentInterest = 50;
                    atualizarHUD();
                    addMsg("<div class='coach-box'><strong>AVANÇO DE FASE!</strong><br>Conexão estabelecida. Hora do fechamento.</div>", 'ai', true);
                    mostrarDica("Use um comando embutido para convidá-la a sair.");
                } else {
                    gameOver(true);
                }
            }
        }

        function gameOver(vitoria) {
            let cor = vitoria ? "var(--good)" : "var(--bad)";
            let titulo = vitoria ? "🏆 VITÓRIA" : "💀 GAME OVER";
            let msg = vitoria ? "Você usou as técnicas perfeitamente. Ela está rendida." : "O interesse zerou. Ela se virou e foi embora.";
            
            addMsg(`<div class="coach-box" style="border-color: ${cor}; color: ${cor};"><strong>${titulo}</strong><br>${msg}</div>`, 'ai', true);
            promptInput.disabled = true;
            document.querySelector('.send').disabled = true;
            document.querySelector('.send').style.background = "#333";
            
            let btn = document.createElement('button');
            btn.className = 'start-btn';
            btn.style.marginTop = '10px';
            btn.innerText = "JOGAR NOVAMENTE";
            btn.onclick = () => location.reload();
            chat.appendChild(btn);
            chat.scrollTop = chat.scrollHeight;
        }

        function mostrarDica(dica) {
            const popup = document.getElementById('tip-popup');
            document.getElementById('tip-text').innerText = dica;
            popup.classList.add('show');
            setTimeout(() => { popup.classList.remove('show'); }, 6000);
        }

        function addMsg(text, type, isHtml = false) {
            const div = document.createElement('div');
            div.className = 'msg ' + type;
            if (isHtml) div.innerHTML = text;
            else div.innerText = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
