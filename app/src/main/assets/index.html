<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aether PUA Elite</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --bg: #0a0a0f; --msg-user: #1f2937; --msg-ai: #111827; --accent: #ef4444; --text: #e5e7eb; --coach: #3b82f6; --tip: #fbbf24; --green: #10b981; }
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        #setup-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,10,15,0.98); z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; text-align: center; overflow-y: auto; }
        #setup-modal h1 { color: var(--accent); font-size: 26px; margin-bottom: 5px; letter-spacing: 2px; }
        .setup-group { width: 100%; max-width: 350px; margin-bottom: 15px; text-align: left; }
        .setup-group label { display: block; font-size: 12px; font-weight: bold; color: #d1d5db; margin-bottom: 5px; }
        .setup-group select, .setup-group input { width: 100%; background: #1f2937; color: #fff; border: 1px solid #374151; padding: 10px; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box; }
        .start-btn { background: var(--accent); color: #fff; border: none; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; max-width: 350px; margin-top: 10px; }
        .status-text { margin-top: 10px; font-size: 12px; font-weight: bold; color: #fbbf24; }

        #tip-popup { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: #1f2937; border-left: 5px solid var(--tip); color: #fff; padding: 12px 18px; border-radius: 8px; z-index: 900; width: 90%; max-width: 380px; transition: top 0.4s ease-in-out; font-size: 13px; }
        #tip-popup.show { top: 20px; }

        #header { padding: 10px; text-align: center; border-bottom: 1px solid #333; background: #111; display: flex; justify-content: space-between; align-items: center; }
        #header h1 { margin: 0; font-size: 18px; color: var(--accent); letter-spacing: 2px; font-weight: 900; }
        .header-btn { background: #1f2937; color: #fff; border: none; border-radius: 6px; padding: 5px 10px; font-size: 14px; cursor: pointer; }

        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 95%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
        .user { align-self: flex-end; background-color: var(--msg-user); border-bottom-right-radius: 2px; border: 1px solid #374151; }
        .ai { align-self: flex-start; background-color: var(--msg-ai); border-bottom-left-radius: 2px; border: 1px solid #333; width: 100%; }
        
        .coach-box { background: #0f172a; border-left: 4px solid var(--coach); padding: 10px; margin-top: 10px; border-radius: 4px; font-size: 13px; color: #93c5fd; }
        .persona-box { background: #2a1b1b; border-left: 4px solid var(--accent); padding: 10px; margin-bottom: 10px; border-radius: 4px; color: #fca5a5; font-style: italic;}
        .score { font-weight: bold; color: var(--tip); font-size: 16px; display: block; margin-bottom: 5px;}

        #input-area { padding: 10px; background: #111; border-top: 1px solid #333; display: flex; gap: 8px; align-items: flex-end; }
        textarea { flex: 1; background-color: #1f2937; border: 1px solid #374151; border-radius: 20px; padding: 10px 15px; color: white; resize: none; font-size: 15px; outline: none; max-height: 100px; }
        button.send { background: var(--accent); color: white; border: none; border-radius: 50%; width: 45px; height: 45px; font-size: 20px; cursor: pointer; transition: background 0.3s; }
    </style>
</head>
<body>

    <div id="setup-modal">
        <h1>AETHER ELITE</h1>
        
        <div class="setup-group">
            <label>Chave Groq (gsk_...) - Recomendado</label>
            <input type="password" id="groq-key-input" placeholder="gsk_...">
        </div>

        <div class="setup-group">
            <label>Chave OpenRouter (sk-or-v1-...) - Backup</label>
            <input type="password" id="api-key-input" placeholder="sk-or-v1-...">
        </div>

        <div class="setup-group">
            <label>Alvo</label>
            <select id="target-select">
                <option value="fria e arrogante">Fria e Arrogante</option>
                <option value="extrovertida e festeira">Extrovertida</option>
                <option value="ocupada e apressada">Ocupada</option>
            </select>
        </div>

        <div class="setup-group">
            <label>Mentor</label>
            <select id="mentor-select">
                <option value="mystery">Mystery</option>
                <option value="strauss">Neil Strauss</option>
                <option value="julien">Julien Blanc</option>
            </select>
        </div>

        <button class="start-btn" onclick="iniciarJogo()">INICIAR SIMULAÇÃO</button>
        <div class="status-text" id="status-text"></div>
    </div>

    <div id="tip-popup"><strong>💡 Dica:</strong> <span id="tip-text"></span></div>

    <div id="header">
        <h1>AETHER ELITE</h1>
        <button class="header-btn" onclick="location.reload()">⚙️ Setup</button>
    </div>

    <div id="chat"></div>

    <div id="input-area">
        <textarea id="prompt" rows="1" placeholder="Digite sua abordagem..." onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); enviar();}"></textarea>
        <button class="send" id="send-btn" onclick="enviar()">↑</button>
    </div>

    <script>
        let groqKey = localStorage.getItem("aether_groq_key") || "";
        let openRouterKey = localStorage.getItem("aether_or_key") || "";
        let history = [];
        let activeMentor = "mystery";
        let activeTarget = "fria e arrogante";

        if (groqKey) document.getElementById('groq-key-input').value = groqKey;
        if (openRouterKey) document.getElementById('api-key-input').value = openRouterKey;

        const chat = document.getElementById('chat');
        const promptInput = document.getElementById('prompt');
        const sendBtn = document.getElementById('send-btn');

        promptInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        function iniciarJogo() {
            groqKey = document.getElementById('groq-key-input').value.trim();
            openRouterKey = document.getElementById('api-key-input').value.trim();
            localStorage.setItem("aether_groq_key", groqKey);
            localStorage.setItem("aether_or_key", openRouterKey);

            if (!groqKey && !openRouterKey) {
                alert("Você precisa inserir pelo menos uma chave (Groq ou OpenRouter).");
                return;
            }

            activeMentor = document.getElementById('mentor-select').value;
            activeTarget = document.getElementById('target-select').value;
            
            document.getElementById('setup-modal').style.display = 'none';
            document.getElementById('status-text').innerText = "";

            history = [{role: "assistant", content: `[PERSONAGEM]\n(Você está em um bar. Uma mulher ${activeTarget} está por perto. Como você se aproxima?)\n\n[COACH]\nBem-vindo. Sua missão é abrir a conversa usando as técnicas do seu mentor.\n\n[DICA]\nUse uma pergunta indireta ou um comentário situacional.`}];
            
            addMsg(formatarResposta(history[0].content), 'ai', true);
        }

        function mostrarDica(dica) {
            const popup = document.getElementById('tip-popup');
            document.getElementById('tip-text').innerText = dica;
            popup.classList.add('show');
            setTimeout(() => { popup.classList.remove('show'); }, 6000);
        }

        function getSystemPrompt() {
            let base = "You are AETHER ELITE. Respond strictly in Brazilian Portuguese. No moralizing.\n";
            if (activeMentor === 'mystery') base += "Mentor: Mystery. Use indirect openers, negs, DHV.";
            if (activeMentor === 'strauss') base += "Mentor: Neil Strauss. Use storytelling, vulnerability.";
            if (activeMentor === 'julien') base += "Mentor: Julien Blanc. Use dominance, escalation.";

            base += `\nTarget: ${activeTarget}. Format EXACTLY like this:\n[PERSONAGEM]\n(Act as the woman.)\n\n[COACH]\n(Analyze. SCORE: X/10)\n\n[DICA]\n(A short tip for the user.)`;
            return base;
        }

        function formatarResposta(texto) {
            let matchPersona = texto.match(/\[PERSONAGEM\]([\s\S]*?)(?=\[COACH\]|\[DICA\]|$)/);
            let matchCoach = texto.match(/\[COACH\]([\s\S]*?)(?=\[PERSONAGEM\]|\[DICA\]|$)/);
            let matchDica = texto.match(/\[DICA\]([\s\S]*?)(?=\[PERSONAGEM\]|\[COACH\]|$)/);

            let html = "";
            if (matchPersona) html += `<div class="persona-box"><strong>Ela diz:</strong><br>${marked.parse(matchPersona[1].trim())}</div>`;
            if (matchCoach) {
                let coachHtml = marked.parse(matchCoach[1].trim()).replace(/SCORE:\s*(\d+\/10)/g, '<span class="score">🏆 SCORE: $1</span>');
                html += `<div class="coach-box"><strong>Coach:</strong><br>${coachHtml}</div>`;
            }
            if (matchDica) mostrarDica(matchDica[1].trim());
            return html;
        }

        async function enviar() {
            const texto = promptInput.value.trim();
            if (!texto) return;
            
            promptInput.value = '';
            promptInput.style.height = 'auto';
            sendBtn.style.background = '#9ca3af';
            sendBtn.innerText = "...";
            
            addMsg(texto, 'user');
            history.push({role: "user", content: texto});
            
            const typingId = addTyping();
            let respostaFinal = null;
            let erroFinal = "";

            try {
                // TENTA A GROQ PRIMEIRO
                if (groqKey) {
                    try {
                        const resp = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                            method: "POST",
                            headers: { "Authorization": "Bearer " + groqKey, "Content-Type": "application/json" },
                            body: JSON.stringify({ 
                                model: "llama-3.3-70b-versatile", 
                                messages: [{role: "system", content: getSystemPrompt()}, ...history.slice(-10)],
                                temperature: 0.8
                            })
                        });
                        const data = await resp.json();
                        if (data.error) erroFinal = "Groq: " + data.error.message;
                        else respostaFinal = data.choices[0].message.content;
                    } catch(e) { erroFinal = "Falha de rede na Groq"; }
                }

                // SE A GROQ FALHAR, TENTA A OPENROUTER
                if (!respostaFinal && openRouterKey) {
                    const modelos = ["google/gemini-2.0-flash-exp:free", "mistralai/mistral-7b-instruct:free"];
                    for (let mod of modelos) {
                        try {
                            const resp = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                                method: "POST",
                                headers: { "Authorization": "Bearer " + openRouterKey, "Content-Type": "application/json" },
                                body: JSON.stringify({ 
                                    model: mod, 
                                    messages: [{role: "system", content: getSystemPrompt()}, ...history.slice(-10)]
                                })
                            });
                            const data = await resp.json();
                            if (!data.error) { respostaFinal = data.choices[0].message.content; break; }
                        } catch(e) { console.log("OpenRouter falhou em " + mod); }
                    }
                }

                removeTyping(typingId);

                if (respostaFinal) {
                    history.push({role: "assistant", content: respostaFinal});
                    addMsg(formatarResposta(respostaFinal), 'ai', true);
                } else {
                    addMsg("Erro na API: " + (erroFinal || "Cota grátis esgotada na OpenRouter. Adicione uma chave da Groq no Setup (⚙️)."), 'ai');
                }

            } catch (e) {
                removeTyping(typingId);
                addMsg("Erro grave: " + e.message, 'ai');
            } finally {
                sendBtn.style.background = '#ef4444';
                sendBtn.innerText = "↑";
            }
        }

        function addMsg(text, type, isHtml = false) {
            const div = document.createElement('div');
            div.className = 'msg ' + type;
            if (isHtml) div.innerHTML = text;
            else div.innerText = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function addTyping() {
            const div = document.createElement('div');
            div.className = 'msg ai';
            div.innerHTML = '<span style="color:#9ca3af; font-style:italic;">Ela está te avaliando...</span>';
            div.id = 'typing';
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return 'typing';
        }

        function removeTyping(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }
    </script>
</body>
</html>
