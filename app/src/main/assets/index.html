<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aether PUA Elite</title>
    <style>
        :root { 
            --bg: #030305; --msg-user: #1f2937; --msg-ai: #0a0a0f; 
            --accent: #ef4444; --text: #e5e7eb; --coach: #3b82f6; 
            --tip: #fbbf24; --good: #10b981; --tension: #e11d48; --bad: #ef4444;
        }
        body { margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Setup */
        #setup-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3,3,5,0.98); z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; text-align: center; overflow-y: auto;}
        #setup-modal h1 { color: var(--accent); font-size: 24px; margin-bottom: 5px; letter-spacing: 3px; font-weight: 900; text-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
        .setup-group { width: 100%; max-width: 350px; margin-bottom: 10px; text-align: left; }
        .setup-group label { display: block; font-size: 10px; font-weight: bold; color: #9ca3af; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 1px;}
        .setup-group input, .setup-group select { width: 100%; background: #111; color: #fff; border: 1px solid #333; padding: 8px; border-radius: 4px; font-size: 13px; outline: none; box-sizing: border-box; font-family: inherit;}
        .setup-group input:focus, .setup-group select:focus { border-color: var(--accent); }
        .start-btn { background: var(--accent); color: #fff; border: none; padding: 12px; border-radius: 4px; font-size: 14px; font-weight: bold; cursor: pointer; width: 100%; max-width: 350px; margin-top: 10px; letter-spacing: 2px;}

        /* HUD */
        #hud { background: #0a0a0f; padding: 8px 15px; border-bottom: 1px solid #1f2937; display: flex; flex-direction: column; gap: 4px; }
        .hud-row { display: flex; justify-content: space-between; font-size: 10px; font-weight: bold; color: #9ca3af; text-transform: uppercase; letter-spacing: 1px;}
        .bar-bg { width: 100%; height: 4px; background: #222; border-radius: 2px; overflow: hidden; margin-bottom: 2px;}
        #interest-bar { height: 100%; width: 50%; background: var(--good); transition: width 0.5s; box-shadow: 0 0 8px var(--good); }
        #tension-bar { height: 100%; width: 10%; background: var(--tension); transition: width 0.5s; box-shadow: 0 0 8px var(--tension); }

        /* Toast */
        #tip-popup { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: #111; border: 1px solid var(--tip); color: #fff; padding: 10px; border-radius: 4px; z-index: 900; width: 90%; max-width: 380px; transition: top 0.3s ease-out; font-size: 12px; box-shadow: 0 0 15px rgba(251, 191, 36, 0.3); }
        #tip-popup.show { top: 15px; }
        #tip-popup strong { color: var(--tip); display: block; margin-bottom: 3px; font-size: 10px; text-transform: uppercase;}

        /* Chat */
        #chat { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 95%; padding: 10px 14px; border-radius: 6px; font-size: 13px; line-height: 1.5; word-wrap: break-word; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;}
        .user { align-self: flex-end; background-color: var(--msg-user); border-right: 3px solid #fff; }
        .ai { align-self: flex-start; background-color: var(--msg-ai); border: 1px solid #1f2937; width: 100%; }
        
        .coach-box { background: #0a1128; border-left: 3px solid var(--coach); padding: 10px; margin-top: 8px; border-radius: 4px; font-size: 12px; color: #93c5fd; font-family: monospace;}
        .persona-box { background: #1a0b0b; border-left: 3px solid var(--accent); padding: 10px; margin-bottom: 8px; border-radius: 4px; color: #fca5a5; font-style: italic; position: relative; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;}
        .neediness-box { background: #4a0404; border-left: 3px solid #ff0000; padding: 8px; margin-bottom: 8px; border-radius: 4px; color: #ffbaba; font-size: 12px; font-weight: bold;}
        
        .tts-btn { position: absolute; top: 6px; right: 6px; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px; padding: 2px 6px; cursor: pointer; font-size: 10px;}
        .tts-btn:active { background: var(--accent); }

        /* Input e Chips */
        #tactic-chips { display: flex; overflow-x: auto; gap: 5px; padding: 5px 10px; background: #0a0a0f; scrollbar-width: none; border-top: 1px solid #1f2937;}
        .chip { background: #111; color: #9ca3af; border: 1px solid #333; padding: 5px 10px; border-radius: 12px; font-size: 11px; white-space: nowrap; cursor: pointer; }
        .chip:active { border-color: var(--accent); color: var(--accent); }

        #input-area { padding: 8px 10px; background: #0a0a0f; border-bottom: 1px solid #1f2937; display: flex; gap: 6px; align-items: flex-end; }
        textarea { flex: 1; background-color: #111; border: 1px solid #333; border-radius: 6px; padding: 10px; color: white; resize: none; font-size: 13px; outline: none; max-height: 80px; font-family: inherit;}
        textarea:focus { border-color: var(--accent); }
        button.icon-btn { background: #111; color: white; border: 1px solid #333; border-radius: 6px; width: 40px; height: 40px; font-size: 16px; cursor: pointer; display: flex; justify-content: center; align-items: center;}
        button.send { background: var(--accent); color: white; border: none; border-radius: 6px; width: 40px; height: 40px; font-size: 18px; cursor: pointer; display: flex; justify-content: center; align-items: center;}
        
        .live-active { background: var(--bad) !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="setup-modal">
        <h1>AETHER ELITE</h1>
        
        <div class="setup-group">
            <label>Gemini API Key</label>
            <input type="password" id="gemini-key" placeholder="AIza...">
        </div>

        <div class="setup-group">
            <label>Contexto</label>
            <select id="context-select">
                <option value="Bar / Balada">Night Game (Bar/Balada)</option>
                <option value="Tinder / Instagram">Online Game (Tinder/Insta)</option>
                <option value="Rua / Shopping">Day Game (Rua/Shopping)</option>
                <option value="Festa de amigos">Social Circle (Festa de amigos)</option>
            </select>
        </div>

        <div class="setup-group">
            <label>Doutrina (Mentor)</label>
            <select id="mentor-select">
                <option value="Mentalista (Leitura Fria / NLP)">Mentalista</option>
                <option value="Mystery (Negs / Peacocking)">Mystery</option>
                <option value="Julien Blanc (Dominância / Escalação)">Julien Blanc</option>
                <option value="Inner Game (Frame / Confiança)">Inner Game Coach</option>
            </select>
        </div>

        <button class="start-btn" onclick="iniciarJogo()">INICIAR MISSÃO</button>
    </div>

    <div id="hud">
        <div class="hud-row">
            <span>INTERESSE</span>
            <span id="interest-text" style="color:var(--good)">50%</span>
        </div>
        <div class="bar-bg"><div id="interest-bar"></div></div>
        
        <div class="hud-row">
            <span style="color:var(--tension)">TENSÃO</span>
            <span id="tension-text" style="color:var(--tension)">10%</span>
        </div>
        <div class="bar-bg"><div id="tension-bar"></div></div>
    </div>

    <div id="tip-popup"><strong>💡 TÁTICA</strong><span id="tip-text"></span></div>

    <div id="chat"></div>

    <div id="tactic-chips">
        <div class="chip" onclick="usarTatica('Push-Pull: Elogia e depois desqualifica.')">Push-Pull</div>
        <div class="chip" onclick="usarTatica('Role Reversal: Inverte os papéis, age como se ela estivesse tentando te conquistar.')">Role Reversal</div>
        <div class="chip" onclick="usarTatica('False Disqualification: Finge que não é o tipo dela.')">Desqualificação Falsa</div>
        <div class="chip" onclick="usarTatica('Time Distortion: Fala como se já se conhecessem há anos.')">Time Distortion</div>
    </div>

    <div id="input-area">
        <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleImage(this)">
        <button class="icon-btn" onclick="document.getElementById('file-input').click()">📎</button>
        <button class="icon-btn" id="live-btn" onclick="toggleLiveMode()">🎙️</button>
        <textarea id="prompt" rows="1" placeholder="Sua abordagem..." onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); checarEEnviar();}"></textarea>
        <button class="send" onclick="checarEEnviar()">↑</button>
    </div>

    <script>
        let geminiKey = localStorage.getItem("aether_gemini_key") || "";
        if (geminiKey) document.getElementById('gemini-key').value = geminiKey;

        let activeMentor = "";
        let activeContext = "";
        let history = [];
        let currentInterest = 50;
        let currentTension = 10;
        let currentBase64Image = null;
        let synth = window.speechSynthesis;
        
        let isLiveMode = false;
        let isRecording = false;
        let recognition = null;

        const chat = document.getElementById('chat');
        const interestBar = document.getElementById('interest-bar');
        const tensionBar = document.getElementById('tension-bar');
        const promptInput = document.getElementById('prompt');
        const sendBtn = document.querySelector('.send');
        const liveBtn = document.getElementById('live-btn');

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = false;
            recognition.onresult = function(event) {
                promptInput.value = event.results[0][0].transcript;
                if (isLiveMode) checarEEnviar();
            };
            recognition.onend = function() {
                isRecording = false;
                liveBtn.classList.remove('live-active');
            };
        }

        function iniciarJogo() {
            let keyInput = document.getElementById('gemini-key').value.trim();
            if (!keyInput) { alert("Insira sua chave Gemini."); return; }
            geminiKey = keyInput;
            localStorage.setItem("aether_gemini_key", geminiKey);

            activeMentor = document.getElementById('mentor-select').value;
            activeContext = document.getElementById('context-select').value;
            
            document.getElementById('setup-modal').style.display = 'none';
            atualizarHUD();

            let intro = `[PERSONAGEM]\n(Missão iniciada no contexto: ${activeContext}.)\n\n[COACH]\nDoutrina: ${activeMentor}. Pode começar.\n\n[DICA]\nFaça a sua abordagem.\n\n[STATE]\n{"interest": 50, "tension": 10}`;
            history.push({role: "model", parts: [{text: intro}]});
            addMsg(parseAIResponse(intro), 'ai', true);
        }

        function usarTatica(tatica) {
            promptInput.value = tatica;
            promptInput.focus();
        }

        function toggleLiveMode() {
            isLiveMode = !isLiveMode;
            if (isLiveMode) {
                liveBtn.classList.add('live-active');
                if(recognition) try { recognition.start(); isRecording = true; } catch(e){}
            } else {
                liveBtn.classList.remove('live-active');
                if(recognition) recognition.stop();
                if(synth.speaking) synth.cancel();
            }
        }

        // --- NOVO: FILTRO ANTI-NEEDY (CARENTE) ---
        function checarEEnviar() {
            let texto = promptInput.value.toLowerCase();
            let isNeedy = false;
            let aviso = "";

            if (texto.includes("por favor") || texto.includes("desculpa") || texto.includes("me desculpe")) {
                isNeedy = true; aviso = "Pedir desculpas/por favor abaixa seu valor. Fale como igual.";
            } else if (texto.includes("linda") || texto.includes("gata") || texto.includes("princesa")) {
                isNeedy = true; aviso = "Elogios genéricos te colocam na Friendzone. Use algo específico.";
            } else if (texto.length > 150 && activeContext.includes("Online")) {
                isNeedy = true; aviso = "Textão no Tinder? Parece desespero. Seja breve e misterioso.";
            } else if ((texto.match(/😍|🥺|😘|❤️/g) || []).length > 2) {
                isNeedy = true; aviso = "Muitos emojis fofos. Você parece um fã, não um cara pegando.";
            }

            if (isNeedy) {
                addMsg(`<div class="neediness-box">⚠️ ALERTA DE CARÊNCIA: ${aviso}<br>O Coach bloqueou o envio. Reescreva a sua mensagem.</div>`, 'ai', true);
                return; // Bloqueia o envio
            }

            enviarTexto();
        }

        function handleImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentBase64Image = e.target.result.split(',')[1];
                    promptInput.value = "Analise esse print e me diga a resposta exata.";
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function lerTexto(texto, btn) {
            if (synth.speaking) { synth.cancel(); return; }
            const utter = new SpeechSynthesisUtterance(texto); 
            utter.lang = 'pt-BR';
            utter.rate = 1.1;
            if(btn) btn.style.color = "#10b981";
            utter.onend = () => { 
                if(btn) btn.style.color = "#fff"; 
                if(isLiveMode) { try { recognition.start(); isRecording = true; } catch(e){} }
            };
            synth.speak(utter);
        }

        function atualizarHUD() {
            interestBar.style.width = currentInterest + '%';
            document.getElementById('interest-text').innerText = currentInterest + '%';
            tensionBar.style.width = currentTension + '%';
            document.getElementById('tension-text').innerText = currentTension + '%';
        }

        function getSystemPrompt() {
            return `You are AETHER ELITE, an elite PUA coach. Respond strictly in Brazilian Portuguese.
Context: ${activeContext}.
Mentor: ${activeMentor}.

FORMAT EXACTLY LIKE THIS:
[PERSONAGEM]
(Act as the woman. React realistically. If it's a Tinder image, read it and provide the exact reply.)

[COACH]
(Analyze his text brutally. If he was needy, roast him. Explain the frame.)

[DICA]
(Max 10 words tactical tip.)

[STATE]
{"interest": <number 0-100>, "tension": <number 0-100>}`;
        }

        function parseAIResponse(text) {
            let html = "";
            let matchPersona = text.match(/\[PERSONAGEM\]([\s\S]*?)(?=\[COACH\]|\[DICA\]|\[STATE\]|$)/);
            let matchCoach = text.match(/\[COACH\]([\s\S]*?)(?=\[PERSONAGEM\]|\[DICA\]|\[STATE\]|$)/);
            let matchDica = text.match(/\[DICA\]([\s\S]*?)(?=\[PERSONAGEM\]|\[COACH\]|\[STATE\]|$)/);
            let matchState = text.match(/\[STATE\]([\s\S]*?)$/);

            if (matchPersona) {
                let pText = matchPersona[1].trim().replace(/\n/g, '<br>');
                html += `<div class="persona-box"><button class="tts-btn" onclick="lerTexto(\`${pText.replace(/`/g, '')}\`, this)">🔊</button><strong>Resposta:</strong><br>${pText}</div>`;
                if(isLiveMode) lerTexto(pText.replace(/<br>/g, ' ').replace(/\(.*?\)/g, ''), null);
            }
            if (matchCoach) html += `<div class="coach-box"><strong>COACH:</strong><br>${matchCoach[1].trim().replace(/\n/g, '<br>')}</div>`;
            if (matchDica) mostrarDica(matchDica[1].trim());
            if (matchState) {
                try {
                    let jsonMatch = matchState[1].match(/\{.*\}/s);
                    if (jsonMatch) {
                        let state = JSON.parse(jsonMatch[0]);
                        if (state.interest !== undefined) currentInterest = state.interest;
                        if (state.tension !== undefined) currentTension = state.tension;
                        atualizarHUD();
                    }
                } catch(e) { }
            }
            return html;
        }

        async function enviarTexto() {
            const texto = promptInput.value.trim();
            if (!texto && !currentBase64Image) return;
            if (!geminiKey) { alert("API Key missing."); return; }

            addMsg(texto || "[IMAGEM]", 'user');
            promptInput.value = '';
            promptInput.style.height = 'auto';
            sendBtn.style.background = '#9ca3af';
            
            let parts = [{text: texto || "Analyze this."}];
            if (currentBase64Image) parts.push({inline_data: {mime_type: "image/jpeg", data: currentBase64Image}});
            
            history.push({role: "user", parts: parts});
            const typingId = addTyping();

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiKey}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        systemInstruction: { parts: [{ text: getSystemPrompt() }] },
                        contents: history.slice(-8)
                    })
                });

                const data = await response.json();
                removeTyping(typingId);

                if (data.error) throw new Error(data.error.message);

                let aiText = data.candidates[0].content.parts[0].text;
                history.push({role: "model", parts: [{text: aiText}]});

                addMsg(parseAIResponse(aiText), 'ai', true);

                if (currentInterest <= 15 || (currentTension <= 5 && currentInterest > 60)) {
                    let motivo = currentInterest <= 15 ? "Você foi muito chato ou desrespeitoso." : "Você agiu como um amigo, sem gerar atração.";
                    setTimeout(() => gerarAutopsia(motivo), 2500);
                }

            } catch (e) {
                removeTyping(typingId);
                addMsg("Erro: " + e.message, 'ai');
            } finally {
                sendBtn.style.background = '#ef4444';
                currentBase64Image = null;
            }
        }

        async function gerarAutopsia(motivo) {
            addMsg(`<div class="coach-box" style="color:var(--bad); border-color:var(--bad)"><strong>💀 FIM DE JOGO</strong><br>${motivo}<br><br>Gerando relatório...</div>`, 'ai', true);
            const prompt = `O usuário falhou. Motivo: ${motivo}. Analise a conversa e escreva uma Autópsia brutal apontando erros de frame e inseguranças.`;
            
            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiKey}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        systemInstruction: { parts: [{ text: "Você é um coach de relacionamentos implacável." }] },
                        contents: [...history.slice(-6), {role: "user", parts: [{text: prompt}]}]
                    })
                });
                const data = await response.json();
                let relatorio = data.candidates[0].content.parts[0].text;
                
                addMsg(`<div class="coach-box" style="border-color:#fff"><strong>📋 RELATÓRIO:</strong><br>${relatorio.replace(/\n/g, '<br>')}</div>`, 'ai', true);
                promptInput.disabled = true;
                sendBtn.disabled = true;
                sendBtn.style.background = "#333";
            } catch(e) {}
        }

        function mostrarDica(dica) {
            const popup = document.getElementById('tip-popup');
            document.getElementById('tip-text').innerText = dica;
            popup.classList.add('show');
            setTimeout(() => { popup.classList.remove('show'); }, 6000);
        }

        function addMsg(text, type, isHtml = false) {
            const div = document.createElement('div');
            div.className = 'msg ' + type;
            if (isHtml) div.innerHTML = text;
            else div.innerText = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function addTyping() {
            const div = document.createElement('div');
            div.className = 'msg ai';
            div.innerHTML = '<span style="color:#6b7280; font-style:italic; font-family:monospace;">Processando...</span>';
            div.id = 'typing';
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return 'typing';
        }

        function removeTyping(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }
    </script>
</body>
</html>
