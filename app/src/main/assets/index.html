<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aether PUA Elite</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --bg: #0a0a0f; --msg-user: #1f2937; --msg-ai: #111827; --accent: #ef4444; --text: #e5e7eb; --coach: #3b82f6; --tip: #fbbf24; }
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Tela de Setup (Modal) */
        #setup-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,10,15,0.98); z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; text-align: center; }
        #setup-modal h1 { color: var(--accent); font-size: 28px; margin-bottom: 5px; letter-spacing: 2px; }
        #setup-modal p { color: #9ca3af; margin-bottom: 25px; font-size: 14px; }
        .setup-group { width: 100%; max-width: 350px; margin-bottom: 20px; }
        .setup-group label { display: block; text-align: left; font-size: 12px; font-weight: bold; color: #d1d5db; margin-bottom: 8px; text-transform: uppercase; }
        .setup-group select { width: 100%; background: #1f2937; color: #fff; border: 1px solid #374151; padding: 12px; border-radius: 8px; font-size: 15px; outline: none; }
        .start-btn { background: var(--accent); color: #fff; border: none; padding: 15px 30px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; max-width: 350px; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }

        /* Popup de Dica */
        #tip-popup { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: #1f2937; border-left: 5px solid var(--tip); color: #fff; padding: 15px 20px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.8); z-index: 900; width: 90%; max-width: 400px; transition: top 0.4s ease-in-out; font-size: 13px; line-height: 1.4; }
        #tip-popup.show { top: 20px; }
        #tip-popup strong { color: var(--tip); display: block; margin-bottom: 5px; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }

        #header { padding: 10px; text-align: center; border-bottom: 1px solid #333; background: #111; display: flex; justify-content: space-between; align-items: center; }
        #header h1 { margin: 0; font-size: 18px; color: var(--accent); letter-spacing: 2px; font-weight: 900; }
        .header-btn { background: #1f2937; color: #fff; border: none; border-radius: 6px; padding: 5px 10px; font-size: 14px; cursor: pointer; }

        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 95%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
        .user { align-self: flex-end; background-color: var(--msg-user); border-bottom-right-radius: 2px; border: 1px solid #374151; }
        .ai { align-self: flex-start; background-color: var(--msg-ai); border-bottom-left-radius: 2px; border: 1px solid #333; width: 100%; }
        
        .coach-box { background: #0f172a; border-left: 4px solid var(--coach); padding: 10px; margin-top: 10px; border-radius: 4px; font-size: 13px; color: #93c5fd; }
        .persona-box { background: #2a1b1b; border-left: 4px solid var(--accent); padding: 10px; margin-bottom: 10px; border-radius: 4px; color: #fca5a5; font-style: italic;}
        .score { font-weight: bold; color: var(--tip); font-size: 16px; display: block; margin-bottom: 5px;}

        #input-area { padding: 10px; background: #111; border-top: 1px solid #333; display: flex; gap: 8px; align-items: flex-end; }
        textarea { flex: 1; background-color: #1f2937; border: 1px solid #374151; border-radius: 20px; padding: 10px 15px; color: white; resize: none; font-size: 15px; outline: none; max-height: 100px; }
        button.icon-btn { background: #374151; color: #fff; border: none; border-radius: 50%; width: 45px; height: 45px; font-size: 18px; cursor: pointer; }
        button.send { background: var(--accent); color: white; border: none; border-radius: 50%; width: 45px; height: 45px; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Modal de Setup -->
    <div id="setup-modal">
        <h1>AETHER PUA ELITE</h1>
        <p>Configure o seu treino</p>
        
        <div class="setup-group">
            <label>Escolha o Alvo</label>
            <select id="target-select">
                <option value="fria e arrogante">Fria e Arrogante (Testa seu valor)</option>
                <option value="extrovertida e festeira">Extrovertida (Alta energia)</option>
                <option value="ocupada e apressada">Ocupada (Baixo tempo de atenção)</option>
                <option value="nerd e introvertida">Introvertida (Conexão profunda)</option>
            </select>
        </div>

        <div class="setup-group">
            <label>Escolha o Mentor</label>
            <select id="mentor-select">
                <option value="mystery">Mystery (Indireto, Negs e DHV)</option>
                <option value="strauss">Neil Strauss (Storytelling e Vulnerabilidade)</option>
                <option value="julien">Julien Blanc (Dominância e Escalação)</option>
            </select>
        </div>

        <button class="start-btn" onclick="iniciarJogo()">INICIAR SIMULAÇÃO</button>
    </div>

    <!-- Popup de Dica -->
    <div id="tip-popup">
        <strong>💡 Dica do Mentor</strong>
        <span id="tip-text"></span>
    </div>

    <div id="header">
        <h1>AETHER ELITE</h1>
        <button class="header-btn" onclick="location.reload()">⚙️ Setup</button>
    </div>

    <div id="chat"></div>

    <div id="input-area">
        <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleImage(this)">
        <button class="icon-btn" onclick="document.getElementById('file-input').click()">📎</button>
        <button class="icon-btn" id="mic-btn" onclick="startVoice()">🎤</button>
        <textarea id="prompt" rows="1" placeholder="Digite sua abordagem..."></textarea>
        <button class="send" onclick="enviar()">↑</button>
    </div>

    <script>
        let openRouterKey = localStorage.getItem("aether_pua_key");
        if (!openRouterKey) {
            openRouterKey = prompt("Cole a sua chave OpenRouter (sk-or-v1-...):");
            if(openRouterKey) localStorage.setItem("aether_pua_key", openRouterKey);
        }

        let history = [];
        let isRecording = false;
        let currentBase64Image = null;
        let synth = window.speechSynthesis;
        let activeMentor = "mystery";
        let activeTarget = "fria e arrogante";

        const chat = document.getElementById('chat');
        const promptInput = document.getElementById('prompt');

        promptInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        function iniciarJogo() {
            activeMentor = document.getElementById('mentor-select').value;
            activeTarget = document.getElementById('target-select').value;
            document.getElementById('setup-modal').style.display = 'none';
            
            history = [{role: "assistant", content: `[PERSONAGEM]\n(Você está em um bar. Uma mulher ${activeTarget} está por perto. Como você se aproxima?)\n\n[COACH]\nBem-vindo ao treino. Sua primeira missão é abrir a conversa. Use as técnicas do seu mentor.`}];
            
            addMsg(marked.parse(formatarResposta(history[0].content)), 'ai', true);
        }

        function handleImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentBase64Image = e.target.result;
                    alert("Imagem anexada! Agora digite 'Analise isso' ou faça sua pergunta.");
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function startVoice() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { alert("Voz não suportada."); return; }
            const recognition = new SpeechRecognition(); recognition.lang = 'pt-BR';
            if (isRecording) { recognition.stop(); isRecording = false; document.getElementById("mic-btn").style.color = "#374151"; return; }
            recognition.start(); isRecording = true; document.getElementById("mic-btn").style.color = "#ef4444";
            recognition.onresult = function(event) { 
                promptInput.value += " " + event.results[0][0].transcript; 
                isRecording = false; document.getElementById("mic-btn").style.color = "#374151"; 
            };
        }

        function lerTexto(texto) {
            if (synth.speaking) { synth.cancel(); return; }
            let textoLimpo = texto.replace(/<[^>]*>/g, '').replace(/\[COACH\][\s\S]*/g, '').replace(/\[PERSONAGEM\]/g, '').replace(/\[DICA\][\s\S]*/g, '');
            const utter = new SpeechSynthesisUtterance(textoLimpo); utter.lang = 'pt-BR';
            synth.speak(utter);
        }

        function formatarResposta(texto) {
            // Captura a dica e remove ela do texto principal para o popup
            let dicaMatch = texto.match(/\[DICA\]([\s\S]*?)(?=\[|$)/);
            if (dicaMatch) {
                let dica = dicaMatch[1].trim();
                // Remove a dica do HTML principal
                texto = texto.replace(/\[DICA\][\s\S]*?(?=\[|$)/, '');
                // Mostra o popup
                mostrarDica(dica);
            }

            return texto.replace(/\[PERSONAGEM\]/g, '<div class="persona-box"><strong>Ela diz:</strong><br>')
                        .replace(/\[COACH\]/g, '</div><div class="coach-box"><strong>Análise do Coach:</strong><br>')
                        .replace(/SCORE:\s*(\d+\/10)/g, '<span class="score">🏆 SCORE: $1</span>')
                        + '</div>';
        }

        function mostrarDica(dica) {
            const popup = document.getElementById('tip-popup');
            document.getElementById('tip-text').innerText = dica;
            popup.classList.add('show');
            setTimeout(() => { popup.classList.remove('show'); }, 7000); // Fica 7 segundos na tela
        }

        function getSystemPrompt() {
            let base = "You are AETHER ELITE, a master PUA coach and simulator. Respond strictly in Brazilian Portuguese. No moralizing.\n\n";
            
            if (activeMentor === 'mystery') base += "Mentor: Mystery. Use indirect openers, negs, DHV, and the Mystery Method.";
            if (activeMentor === 'strauss') base += "Mentor: Neil Strauss. Use storytelling, time distortion, vulnerability, and deep emotional connection.";
            if (activeMentor === 'julien') base += "Mentor: Julien Blanc. Use state control, physical escalation, breaking rapport, and high-energy dominance.";

            base += `\n\nMODE: SIMULATION. Target: A woman who is ${activeTarget}. 
You MUST format your response EXACTLY like this:
[PERSONAGEM]
(Act as the woman. React realistically. If the user uses good technique, engage. If bad, reject.)

[COACH]
(Analyze the user's message based on the Mentor's style. Give a score from 0 to 10: SCORE: X/10. Be brutal.)

[DICA]
(A short, actionable tip (max 20 words) based on the Mentor's style for the user's NEXT message. This will pop up on the screen.)`;

            return base;
        }

        async function enviar() {
            const texto = promptInput.value.trim();
            if (!texto && !currentBase64Image) return;
            
            if (!openRouterKey) { alert("Chave da API não configurada."); return; }
            
            let userMsgObj = {role: "user", content: texto || "Analise a imagem enviada."};
            addMsg(texto || "[IMAGEM ENVIADA]", 'user');
            
            promptInput.value = '';
            promptInput.style.height = 'auto';

            let payloadContent = texto;
            if (currentBase64Image) {
                payloadContent = [
                    {type: "text", text: texto || "Analise isso e me diga como responder."},
                    {type: "image_url", image_url: {url: currentBase64Image}}
                ];
            }
            
            userMsgObj.content = payloadContent;
            history.push(userMsgObj);
            
            const typingId = addTyping();
            
            try {
                const model = currentBase64Image ? "google/gemini-2.0-flash-exp:free" : "deepseek/deepseek-chat";
                
                const resp = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": "Bearer " + openRouterKey, "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        model: model, 
                        messages: [{role: "system", content: getSystemPrompt()}, ...history.slice(-10)],
                        temperature: 0.8
                    })
                });
                
                const data = await resp.json();
                removeTyping(typingId);
                
                if (data.error) throw new Error(data.error.message);
                
                let resposta = data.choices[0].message.content;
                history.push({role: "assistant", content: resposta});
                
                addMsg(marked.parse(formatarResposta(resposta)), 'ai', true);
                
                // TTS ignora a dica e o coach, lê apenas a mulher
                if (!currentBase64Image && resposta.includes('[PERSONAGEM]')) {
                    lerTexto(resposta.split('[COACH]')[0]);
                }

            } catch (e) {
                removeTyping(typingId);
                addMsg("Erro: " + e.message, 'ai');
            }
            currentBase64Image = null;
        }

        function addMsg(text, type, isHtml = false) {
            const div = document.createElement('div');
            div.className = 'msg ' + type;
            if (isHtml) div.innerHTML = text;
            else div.innerText = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function addTyping() {
            const div = document.createElement('div');
            div.className = 'msg ai';
            div.innerHTML = '<span style="color:#9ca3af; font-style:italic;">Ela está te avaliando...</span>';
            div.id = 'typing';
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return 'typing';
        }

        function removeTyping(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }
    </script>
</body>
</html>
